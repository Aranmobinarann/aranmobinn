version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aranmobinn
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: aranmobinn
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      - db
    environment:
      PORT: 3000
      APP_NAME: Aranmobinn
      NODE_ENV: production
      DB_USER: aranmobinn
      DB_PASSWORD: changeme
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: aranmobinn
      JWT_SECRET: your-secret-key-change-in-production

volumes:
  postgres_data:
