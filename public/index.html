<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aranmobinn</title>
    <style>
      :root {
        --bg: #0b1120;
        --panel: #111827;
        --panel-soft: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: rgba(148, 163, 184, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(180deg, #020817 0%, #0b1120 100%);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      h1 {
        margin: 0;
        font-size: 2.3rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.15);
        color: #86efac;
        border: 1px solid rgba(34, 197, 94, 0.3);
        font-size: 0.9rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 18px;
        margin-bottom: 28px;
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.25);
      }

      .label {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .value {
        margin-top: 10px;
        font-size: clamp(1.5rem, 4vw, 2.3rem);
        font-weight: 700;
      }

      .panel {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 14px 12px;
        border-bottom: 1px solid var(--border);
      }

      th {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      .status {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .healthy { background: rgba(34, 197, 94, 0.15); color: #86efac; }
      .warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
      .critical { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }

      @media (max-width: 760px) {
        .panel { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Aranmobinn</h1>
        <div class="badge">Multi-chain DeFi Dashboard</div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="label">Total Balance</div>
          <div id="total-balance" class="value">--</div>
        </div>
        <div class="card">
          <div class="label">Holdings</div>
          <div id="holdings" class="value">--</div>
        </div>
        <div class="card">
          <div class="label">Avg Yield</div>
          <div id="avg-yield" class="value">--</div>
        </div>
        <div class="card">
          <div class="label">Network Score</div>
          <div id="network-score" class="value">--</div>
        </div>
      </div>

      <div class="panel">
        <div class="card">
          <h3>Chains Overview</h3>
          <table>
            <thead>
              <tr>
                <th>Chain</th>
                <th>Balance</th>
                <th>Yield</th>
                <th>Latency</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="chain-table-body"></tbody>
          </table>
        </div>

        <div class="card">
          <h3>Alerts</h3>
          <div id="alerts"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
